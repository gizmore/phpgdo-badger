<VirtualHost *:443>
    ServerName badger.mogwai.mira-gpt.org
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/badger.mogwai.mira-gpt.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/badger.mogwai.mira-gpt.org/privkey.pem
    DocumentRoot /home/gizmore/www/phpgdo
    AssignUserID mira gizmore
    AllowEncodedSlashes NoDecode

    <Directory /home/gizmore/www/phpgdo>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    # Removed only after the exposed initial credentials and other deployment
    # blockers have been resolved. The certificate itself is publicly trusted.
    <Location />
        Require local
    </Location>
    <LocationMatch "^/(?:protected|files|files_badger|temp|temp_badger|install)(?:/|$)">
        Require all denied
    </LocationMatch>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/(?:index\.php|assets/)
    RewriteRule ^/(.*)$ /index.php?_url=$1 [QSA,L]
    ErrorLog /home/gizmore/www/phpgdo.badger.error.log
    LogFormat "%h %l %u %t \"%m %H\" %>s %b" badger_nourl
    CustomLog /home/gizmore/www/phpgdo.badger.access.log badger_nourl
</VirtualHost>
