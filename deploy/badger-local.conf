<VirtualHost *:80>
    ServerName badger.mogwai.mira-gpt.org
    DocumentRoot /home/gizmore/www/phpgdo
    AssignUserID mira gizmore
    AllowEncodedSlashes NoDecode

    <Directory /home/gizmore/www/phpgdo>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Location />
        Require local
    </Location>
    # Only the ACME HTTP-01 token directory is reachable publicly while the
    # application remains restricted to local testing.
    Alias /.well-known/acme-challenge/ /var/lib/letsencrypt/.well-known/acme-challenge/
    <Directory /var/lib/letsencrypt/.well-known/acme-challenge>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>
    <LocationMatch "^/(?:protected|files|files_badger|temp|temp_badger|install)(?:/|$)">
        Require all denied
    </LocationMatch>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{REQUEST_URI} !^/(?:index\.php|assets/)
    RewriteRule ^/(.*)$ /index.php?_url=$1 [QSA,L]

    ErrorLog /home/gizmore/www/phpgdo.badger.error.log
    LogFormat "%h %l %u %t \"%m %H\" %>s %b" badger_nourl
    CustomLog /home/gizmore/www/phpgdo.badger.access.log badger_nourl
</VirtualHost>

# Development-only TLS: the listener itself is bound to loopback and the
# certificate is self-signed. Never use this vhost for public deployment.
Listen 127.0.0.1:8443
<VirtualHost 127.0.0.1:8443>
    ServerName badger.mogwai.mira-gpt.org
    SSLEngine on
    SSLCertificateFile /home/gizmore/www/phpgdo/temp_badger/local_tls/cert.pem
    SSLCertificateKeyFile /home/gizmore/www/phpgdo/temp_badger/local_tls/key.pem
    DocumentRoot /home/gizmore/www/phpgdo
    AssignUserID mira gizmore
    AllowEncodedSlashes NoDecode
    <Directory /home/gizmore/www/phpgdo>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <Location />
        Require local
    </Location>
    <LocationMatch "^/(?:protected|files|files_badger|temp|temp_badger|install)(?:/|$)">
        Require all denied
    </LocationMatch>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/(?:index\.php|assets/)
    RewriteRule ^/(.*)$ /index.php?_url=$1 [QSA,L]
    ErrorLog /home/gizmore/www/phpgdo.badger.error.log
    LogFormat "%h %l %u %t \"%m %H\" %>s %b" badger_nourl
    CustomLog /home/gizmore/www/phpgdo.badger.access.log badger_nourl
</VirtualHost>
